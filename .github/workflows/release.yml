name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release (tag the built commit as v<version>)'
        type: boolean
        default: false
      version:
        description: 'Version (X.Y.Z); required when publish is checked from a manual run'
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  WINTUN_VERSION: '0.14.1'
  WINTUN_SHA256: '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51'

jobs:
  # -------------------------------------------------------------
  # ANDROID BUILD
  # -------------------------------------------------------------
  android:
    name: Android (APKs)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve Version
        id: version
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; fi
          if [ -z "$v" ]; then v="1.0.0"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "Building WVF OF Android version $v"

      - uses: actions/setup-go@v5
        with:
          go-version-file: OpenFlux/go.mod
          cache-dependency-path: OpenFlux/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Add Android SDK tools to PATH
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20240908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20240908204917-8b95e45f8d3e

      - name: Build Android Go Core
        run: bash scripts/build-android-core.sh

      - name: Restore Keystore if available
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wvf-release.jks"
            chmod 600 "$RUNNER_TEMP/wvf-release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/wvf-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Assemble Android APKs
        env:
          ANDROID_KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon -PappVersion=${{ steps.version.outputs.value }} :androidApp:assembleRelease

      - name: Collect Android Artifacts
        run: |
          mkdir -p dist-android
          find androidApp/build/outputs/apk/release -name '*.apk' -exec cp {} dist-android/ \;
          for apk in dist-android/*.apk; do
            mv "$apk" "dist-android/WVF-OF-${{ steps.version.outputs.value }}-$(basename "$apk")"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: wvf-of-android
          path: dist-android/*

  # -------------------------------------------------------------
  # DESKTOP BUILD (Windows, Linux, macOS)
  # -------------------------------------------------------------
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            goos: windows
            goarch: amd64
            resources: windows
            tasks: ':desktopApp:createDistributable :desktopApp:packageMsi :desktopApp:packageExe'
            artifact_pattern: 'desktopApp/build/compose/binaries/main/**/*.{msi,exe,zip}'
          - name: Linux x64
            runner: ubuntu-22.04
            goos: linux
            goarch: amd64
            resources: linux
            tasks: ':desktopApp:createDistributable :desktopApp:packageDeb'
            artifact_pattern: 'desktopApp/build/compose/binaries/main/**/*.{deb,tar.gz}'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve Version
        id: version
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; fi
          if [ -z "$v" ]; then v="1.0.0"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "Building WVF OF Desktop version $v on ${{ matrix.name }}"

      - uses: actions/setup-go@v5
        with:
          go-version-file: OpenFlux/go.mod
          cache-dependency-path: OpenFlux/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Desktop Go Core
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} bash scripts/build-core.sh

      - name: Package Desktop App
        run: ./gradlew --no-daemon -PappVersion=${{ steps.version.outputs.value }} ${{ matrix.tasks }}

      - name: Collect Desktop Artifacts
        run: |
          mkdir -p dist-desktop
          find desktopApp/build/compose/binaries/main -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.zip" \) -exec cp {} dist-desktop/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: wvf-of-desktop-${{ matrix.goos }}
          path: dist-desktop/*

  # -------------------------------------------------------------
  # PUBLISH RELEASE
  # -------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    needs: [android, desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (inputs.publish && inputs.version != '')
    steps:
      - uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Prepare Final Release Files & Checksums
        run: |
          mkdir -p release-files
          find all-artifacts -type f -exec cp {} release-files/ \;
          cd release-files
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="v${{ inputs.version }}"
          fi
          
          notes="### WVF OF Release $tag"$'\n\n'
          notes+="Кроссплатформенный клиент для Windows, Linux и Android."$'\n'
          notes+="- **Windows**: MSI-установщик и портативный EXE"$'\n'
          notes+="- **Linux**: DEB-пакет"$'\n'
          notes+="- **Android**: APK (Universal, ARM64, ARMv7)"$'\n\n'
          notes+="Контрольные суммы доступны в \`SHA256SUMS.txt\`."
          
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-files/* --clobber
            gh release edit "$tag" --title "WVF OF $tag" --notes "$notes"
          else
            gh release create "$tag" release-files/* \
              --title "WVF OF $tag" \
              --generate-notes \
              --notes "$notes"
          fi
