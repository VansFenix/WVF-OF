<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E121D"/>
      <stop offset="100%" stop-color="#181F2E"/>
    </linearGradient>
    <linearGradient id="cyanRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#00A2FF"/>
      <stop offset="100%" stop-color="#7B2CBF"/>
    </linearGradient>
    <linearGradient id="violetRibbon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B5179E"/>
      <stop offset="50%" stop-color="#7209B7"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Obsidian Tile -->
  <rect x="64" y="64" width="896" height="896" rx="220" fill="url(#bgGrad)" stroke="#00F0FF" stroke-opacity="0.25" stroke-width="6"/>

  <!-- Glowing Infinity W Wave -->
  <g filter="url(#neonGlow)">
    <!-- Back Loop -->
    <path d="M 280,390 C 180,430 180,620 310,650 C 430,680 470,470 512,390 C 554,470 594,680 714,650 C 844,620 844,430 744,390 C 674,360 600,450 512,560 C 424,450 350,360 280,390 Z" 
          fill="none" stroke="url(#violetRibbon)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Front Flow Ribbon (Forms the W Peak and Energy Crest) -->
    <path d="M 240,370 C 290,440 370,620 450,570 C 512,530 490,370 512,350 C 534,370 512,530 574,570 C 654,620 734,440 784,370" 
          fill="none" stroke="url(#cyanRibbon)" stroke-width="36" stroke-linecap="round"/>
          
    <!-- Core Kinetic Pulse Highlight -->
    <circle cx="512" cy="350" r="14" fill="#FFFFFF"/>
    <circle cx="512" cy="350" r="26" fill="#00F0FF" fill-opacity="0.5"/>
  </g>
</svg>
