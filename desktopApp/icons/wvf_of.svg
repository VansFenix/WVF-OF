<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E17"/>
      <stop offset="100%" stop-color="#161F33"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0077FE"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80F0FF"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="48" y="48" width="928" height="928" rx="210" fill="url(#bgGrad)" stroke="#00E5FF" stroke-opacity="0.4" stroke-width="8"/>

  <!-- Top Flux Data Flow Bars -->
  <rect x="330" y="220" width="140" height="30" rx="15" fill="#00E5FF" fill-opacity="0.85"/>
  <rect x="554" y="220" width="140" height="30" rx="15" fill="#00E5FF" fill-opacity="0.85"/>

  <!-- Kinetic W Wings and Diamond Core -->
  <g filter="url(#glow)">
    <!-- Left outer W wing -->
    <polygon points="210,290 280,290 410,710 330,710" fill="url(#cyanGrad)"/>
    <!-- Right outer W wing -->
    <polygon points="814,290 744,290 614,710 694,710" fill="url(#cyanGrad)"/>
    <!-- Left inner chevron -->
    <polygon points="340,680 410,440 470,440 415,680" fill="url(#innerGrad)"/>
    <!-- Right inner chevron -->
    <polygon points="684,680 614,440 554,440 609,680" fill="url(#innerGrad)"/>
    <!-- Center Diamond Flux Core -->
    <polygon points="512,310 572,450 512,590 452,450" fill="#FFFFFF"/>
    <polygon points="512,360 547,450 512,540 477,450" fill="#00E5FF"/>
    <!-- Bottom anchor pill -->
    <rect x="440" y="740" width="144" height="26" rx="13" fill="#0099FF" fill-opacity="0.85"/>
  </g>
</svg>
